plugins {
    id 'com.android.application'
}

// The web app lives at the repo root; copy it into the APK so it works offline.
def webRoot = rootProject.file('..')
tasks.register('copyWebApp', Copy) {
    from(webRoot) {
        include 'index.html'
    }
    into 'src/main/assets/www'
}
preBuild.dependsOn copyWebApp

android {
    namespace 'app.reversevoice'
    compileSdk 35

    defaultConfig {
        applicationId 'app.reversevoice'
        minSdk 26
        targetSdk 34  // 35 forces edge-to-edge; the page does not pad for system bars in a WebView
        // CI passes the run number so each new APK installs over the previous one.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        // Fixed key committed to the repo so every build can update the installed app.
        // Fine for sideloading; use a private key (GitHub secret) before publishing to Google Play.
        release {
            storeFile file('release.keystore')
            storePassword 'reversevoice'
            keyAlias 'reversevoice'
            keyPassword 'reversevoice'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'  // FileProvider for sharing the WAV file
}
